services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - warehouse-net
    environment:
      POSTGRES_DB:       warehouse
      POSTGRES_USER:     warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - warehouse-net
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./warehouse-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - warehouse-net
    environment:
      NODE_ENV:          production
      PORT:              3001
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       warehouse
      POSTGRES_USER:     warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
      MINIO_ENDPOINT:    minio
      MINIO_PORT:        9000
      MINIO_ACCESS_KEY:  minioadmin
      MINIO_SECRET_KEY:  minioadmin123
      MINIO_BUCKET:      warehouse-photos
      MINIO_USE_SSL:     "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - warehouse-net
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - warehouse-net
    ports:
      - "80:80"
    volumes:
      - ./warehouse-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:

networks:
  warehouse-net:
    driver: bridge